# Notations inspired from Deep Learning, Goodfellow et al. (2016) 
# Adapted from https://github.com/goodfeli/dlbook_notation/.

"\\bold": "{\\bm{#1}}"
"\\newterm": "{\\bf #1}"

# Functions and operators
"\\ceil": "\\lceil #1 \\rceil"
"\\floor": "\\lfloor #1 \\rfloor"
"\\abs": "\\lvert #1 \\rvert"
"\\norm": "\\lVert #1 \\rVert"
"\\dotprod": "\\left\\langle #1 \\,\\middle|\\, #2 \\right\\rangle"
"\\frobenius": "\\left\\langle #1 \\,\\middle|\\, #2 \\right\\rangle_{\\mathcal{F}}"
"\\frobeniusnorm": "\\norm{#1}_{\\mathcal{F}}"

"\\argmax": "\\operatorname*{arg\\,max}"
"\\argmin": "\\operatorname*{arg\\,min}"
"\\sup": "\\operatorname*{sup}"
